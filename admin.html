<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理</title>
    <style>
        :root {
            --bg-color: #fafaf9;
            --text-main: #292524;
            --text-sub: #78716c;
            --border-color: #e7e5e4;
            --hover-color: #f5f5f4;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 80px 40px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            width: 100%; 
            max-width: 640px; 
        }

        .back { 
            display: inline-block; 
            margin-bottom: 40px; 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 13px; 
            transition: color 0.2s;
        }
        .back:hover { 
            color: var(--text-main); 
        }

        h1, h2 { 
            font-size: 18px; 
            font-weight: 400; 
            letter-spacing: 1px; 
            margin-bottom: 30px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 16px; 
            margin-top: 0;
        }
        
        .section-box { 
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            padding: 28px; 
            margin-bottom: 30px; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            color: var(--text-sub); 
            margin-bottom: 8px; 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px; 
            background: #fff; 
            color: var(--text-main); 
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #a8a29e;
        }
        textarea { 
            height: 180px; 
            resize: vertical; 
        }
        
        .btn-group { 
            display: flex; 
            gap: 10px; 
        }

        button { 
            padding: 8px 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer; 
            background: #fff; 
            color: var(--text-main); 
            transition: background 0.2s; 
        }
        button:hover { 
            background: var(--hover-color); 
        }

        .btn-save { 
            background: var(--text-main); 
            color: #fff; 
            border-color: var(--text-main); 
        }
        .btn-save:hover { 
            background: #44403c; 
        }

        .btn-danger { 
            color: #b91c1c; 
            border-color: #fecaca; 
            background: #fef2f2; 
        }
        .btn-danger:hover { 
            background: #fee2e2; 
        }

        .entry-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid #f0efee; 
        }
        .entry-item:last-child { 
            border-bottom: none; 
        }
        .entry-title { 
            font-size: 14px; 
            color: var(--text-main); 
            margin-bottom: 4px; 
            font-weight: 500;
        }
        .entry-meta { 
            font-size: 12px; 
            color: #a8a29e; 
        }
        .manage-list-box { 
            font-size: 14px; 
            color: var(--text-sub); 
        }
    </style>
    <script>if (sessionStorage.getItem("isAuth") !== "true") { window.location.href = "index.html"; }</script>
</head>
<body>
    <div class="container">
        <a href="books.html" class="back">← 返回书架</a>
        
        <div class="section-box">
            <h1>⚙️ 发布新内容</h1>
            
            <label>分类</label>
            <select id="book-category">
                <option value="mystic">🔮 自我觉察与神秘学</option>
                <option value="daily">📝 日常生活手帐</option>
            </select>

            <label>标题</label>
            <input type="text" id="entry-title" placeholder="请输入标题...">

            <label>正文</label>
            <textarea id="entry-content" placeholder="请输入正文内容..."></textarea>
            
            <div class="btn-group">
                <button class="btn-save" onclick="publishToCloud()">发布到云端</button>
                <button onclick="resetToken()">重置 Token</button>
            </div>
        </div>

        <div class="section-box">
            <h2>🗑️ 记录管理</h2>
            <div id="manage-list" class="manage-list-box">正在加载列表...</div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "averyshenmia";       
        const GITHUB_REPO = "diarywebsite.github.io"; 
        const path = "data.json";

        function getGithubToken() {
            let token = localStorage.getItem('github_token');
            if (!token) {
                token = prompt("🔑 请粘贴你的 GitHub Token（仅需输入一次）：");
                if (token) {
                    localStorage.setItem('github_token', token.trim());
                }
            }
            return token ? token.trim() : null;
        }

        function resetToken() {
            localStorage.removeItem('github_token');
            alert('已清除保存的 Token。');
        }

        async function loadEntriesForManage() {
            const token = getGithubToken();
            const listContainer = document.getElementById('manage-list');
            if (!token) {
                listContainer.innerHTML = '未检测到 Token，请先尝试发布一次。';
                return;
            }

            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
                const res = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (res.ok) {
                    const fileData = await res.json();
                    window.currentSha = fileData.sha;
                    const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                    window.allEntries = JSON.parse(decodedContent);

                    if (window.allEntries.length === 0) {
                        listContainer.innerHTML = '暂无任何记录。';
                        return;
                    }

                    listContainer.innerHTML = window.allEntries.map((item, index) => `
                        <div class="entry-item">
                            <div>
                                <div class="entry-title">${item.title}</div>
                                <div class="entry-meta">${item.category === 'mystic' ? '神秘学' : '手帐'} · ${item.date}</div>
                            </div>
                            <button class="btn-danger" onclick="deleteEntry(${index})">删除</button>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = '暂无云端数据文件（发布第一篇后即可在此管理）。';
                }
            } catch (e) {
                listContainer.innerHTML = '加载失败';
            }
        }

        async function publishToCloud() {
            const token = getGithubToken();
            if (!token) return;

            const category = document.getElementById('book-category').value;
            const title = document.getElementById('entry-title').value.trim();
            const content = document.getElementById('entry-content').value.trim();
            
            if(!title || !content) {
                alert('标题和内容不能为空');
                return;
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day} ${hours}:${minutes}`;

            const newEntry = { category, title, content, date: dateStr };

            let entries = window.allEntries || [];
            entries.unshift(newEntry);

            await saveEntriesToCloud(entries, 'Add new entry with precise time');
        }

        async function deleteEntry(index) {
            if (!confirm('确定要删除这条记录吗？')) return;

            let entries = window.allEntries || [];
            entries.splice(index, 1);

            await saveEntriesToCloud(entries, 'Delete entry');
        }

        async function saveEntriesToCloud(entries, message) {
            const token = getGithubToken();
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;

            try {
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(entries, null, 2))));

                const putRes = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: message,
                        content: updatedContent,
                        sha: window.currentSha
                    })
                });

                if (putRes.ok) {
                    alert('操作成功');
                    document.getElementById('entry-title').value = '';
                    document.getElementById('entry-content').value = '';
                    loadEntriesForManage();
                } else {
                    const err = await putRes.json();
                    alert('操作失败: ' + err.message);
                }
            } catch (e) {
                alert('发生错误: ' + e.message);
            }
        }

        window.onload = loadEntriesForManage;
    </script>
</body>
</html>
