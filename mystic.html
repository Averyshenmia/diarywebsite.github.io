<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自我觉察与神秘学</title>
    <style>
        :root {
            --bg-color: #fafaf9;
            --text-main: #292524;
            --text-sub: #78716c;
            --border-color: #e7e5e4;
            --hover-color: #f5f5f4;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 80px 40px; 
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 640px; 
        }

        /* 顶部导航栏 */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            margin-bottom: 40px; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .back-link { 
            font-size: 13px; 
            color: var(--text-sub); 
            text-decoration: none; 
            transition: color 0.2s; 
        }

        .back-link:hover { 
            color: var(--text-main); 
        }

        h1 { 
            font-size: 18px; 
            font-weight: 400; 
            letter-spacing: 1px; 
            margin: 0; 
            color: var(--text-main);
        }

        /* 日记列表区 */
        .entries-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .entry-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 28px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            border-bottom: 1px solid #f0efee;
            padding-bottom: 12px;
        }

        .entry-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            margin: 0;
        }

        .entry-date {
            font-size: 12px;
            color: #a8a29e;
        }

        .entry-content {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .loading, .empty {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            padding: 40px 0;
        }
    </style>
    <script>if (sessionStorage.getItem("isAuth") !== "true") { window.location.href = "index.html"; }</script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 自我觉察与神秘学</h1>
            <a href="books.html" class="back-link">← 返回书架</a>
        </header>

        <div id="entries-list" class="entries-container">
            <div class="loading">正在加载内容...</div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "averyshenmia";
        const GITHUB_REPO = "diarywebsite.github.io";
        const path = "data.json";

        async function loadMysticEntries() {
            const container = document.getElementById('entries-list');
            try {
                const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}?t=` + new Date().getTime();
                const res = await fetch(url);
                
                if (res.ok) {
                    const data = await res.json();
                    // 筛选出 category 为 mystic 的内容
                    const mysticData = data.filter(item => item.category === 'mystic');

                    if (mysticData.length === 0) {
                        container.innerHTML = '<div class="empty">暂无相关记录。</div>';
                        return;
                    }

                    container.innerHTML = mysticData.map(item => `
                        <div class="entry-card">
                            <div class="entry-header">
                                <h2 class="entry-title">${item.title}</h2>
                                <span class="entry-date">${item.date}</span>
                            </div>
                            <div class="entry-content">${item.content}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无云端数据。</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载失败，请检查网络或稍后重试。</div>';
            }
        }

        window.onload = loadMysticEntries;
    </script>
</body>
</html>
