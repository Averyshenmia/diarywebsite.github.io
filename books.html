<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的日记书架</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; color: #334155; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { color: #1e293b; margin: 0; }
        .admin-link { font-size: 14px; color: #64748b; text-decoration: none; background: #e2e8f0; padding: 8px 14px; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .book-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #6366f1; cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-4px); }
        .book-card.mystic { border-top-color: #8b5cf6; }
        .actions { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .btn { padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 15px; }
        .btn-primary { background: #1e293b; color: white; }
    </style>
    <script>if (sessionStorage.getItem("isAuth") !== "true") { window.location.href = "index.html"; }</script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 我的日记书架</h1>
            <a href="admin.html" class="admin-link">⚙️ 管理员后台</a>
        </div>
        
        <div class="grid">
            <a href="mystic.html" class="book-card mystic">
                <h3>🔮 自我觉察与神秘学</h3>
                <p style="color: #64748b; font-size: 14px;">记录塔罗、星盘、内省与灵性成长轨迹。</p>
            </a>
            <a href="daily.html" class="book-card">
                <h3>📝 日常生活手帐</h3>
                <p style="color: #64748b; font-size: 14px;">记录生活点滴、情绪与琐碎日常。</p>
            </a>
        </div>

        <div class="actions">
            <a href="all-entries.html" class="btn btn-primary">📑 全部展开（按时间从新到旧）</a>
        </div>
    </div>
</body>
</html>
