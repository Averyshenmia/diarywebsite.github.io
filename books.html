<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的日记</title>
    <style>
        :root {
            --bg-color: #fafaf9;
            --text-main: #292524;
            --text-sub: #78716c;
            --border-color: #e7e5e4;
            --hover-color: #f5f5f4;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 80px 40px; 
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 640px; 
        }

        /* 顶部导航栏 */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            margin-bottom: 60px; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 { 
            font-size: 20px; 
            font-weight: 400; 
            letter-spacing: 2px; 
            margin: 0; 
            color: var(--text-main);
        }

        .admin-link { 
            font-size: 13px; 
            color: var(--text-sub); 
            text-decoration: none; 
            transition: color 0.2s; 
        }

        .admin-link:hover { 
            color: var(--text-main); 
        }

        /* 书架列表 */
        .shelf-list { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            margin-bottom: 40px; 
        }

        .shelf-item { 
            background: #ffffff; 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px 28px; 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .shelf-item:hover { 
            background: var(--hover-color);
            border-color: #d6d3d1;
            transform: translateY(-1px);
        }

        .shelf-info h2 { 
            font-size: 16px; 
            font-weight: 500; 
            margin: 0 0 6px 0; 
            color: var(--text-main);
        }

        .shelf-info p { 
            font-size: 13px; 
            color: var(--text-sub); 
            margin: 0; 
        }

        .arrow {
            color: #a8a29e;
            font-size: 14px;
        }

        /* 底部全部展开链接 */
        .footer-action { 
            text-align: center; 
            margin-top: 30px; 
        }

        .all-link { 
            font-size: 13px; 
            color: var(--text-sub); 
            text-decoration: none; 
            border-bottom: 1px dashed var(--text-sub);
            padding-bottom: 2px;
            transition: color 0.2s;
        }

        .all-link:hover { 
            color: var(--text-main); 
            border-bottom-color: var(--text-main);
        }
    </style>
    <script>if (sessionStorage.getItem("isAuth") !== "true") { window.location.href = "index.html"; }</script>
</head>
<body>
    <div class="container">
        <header>
            <h1>INDEX / 书架</h1>
            <a href="admin.html" class="admin-link">后台管理</a>
        </header>

        <div class="shelf-list">
            <a href="mystic.html" class="shelf-item">
                <div class="shelf-info">
                    <h2>自我觉察</h2>
                    <p>记录灵性成长</p>
                </div>
                <div class="arrow">→</div>
            </a>

            <a href="daily.html" class="shelf-item">
                <div class="shelf-info">
                    <h2>日常生活</h2>
                    <p>记录生活点滴</p>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>

        <div class="footer-action">
            <a href="all-entries.html" class="all-link">查看全部日记</a>
        </div>
    </div>
</body>
</html>
