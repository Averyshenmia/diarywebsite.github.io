<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>私密空间 - 身份验证</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4f46e5; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 私密日记空间</h2>
        <p style="color: #94a3b8; font-size: 14px;">请输入访问密码</p>
        <input type="password" id="password" placeholder="请输入密码">
        <button onclick="checkPassword()">进入空间</button>
        <div id="error-msg" class="error">密码错误，请重试</div>
    </div>

    <script>
        // 在这里设置你的统一密码
        const CORRECT_PASSWORD = "123"; 

        function checkPassword() {
            const pwd = document.getElementById("password").value;
            if (pwd === CORRECT_PASSWORD) {
                sessionStorage.setItem("isAuth", "true");
                window.location.href = "books.html";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
        document.getElementById("password").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
